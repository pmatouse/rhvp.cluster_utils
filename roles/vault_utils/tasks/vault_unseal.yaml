---
- name: Vault status check
  ansible.builtin.include_tasks: vault_status.yaml

- name: Is the vault sealed?
  ansible.builtin.set_fact:
    vault_sealed: "{{ vault_status['sealed'] | bool }}"

# The previous Job can stop after unseal and before login. In that case the
# encrypted data is accessible, but later stock CLI steps have no session.
- name: Check for an existing Vault CLI session
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "{{ vault_pod }}"
    command: sh -c 'vault token lookup >/dev/null 2>&1'
  register: vault_cli_session
  changed_when: false
  failed_when: vault_cli_session.rc | default(-1) not in [0, 2]
  no_log: true
  when: not vault_sealed

- name: Decide whether to authenticate the managed Vault CLI
  ansible.builtin.set_fact:
    vault_login_needed: "{{ vault_sealed or (vault_cli_session.rc | default(0)) == 2 }}"

# We reparse the json vault init secret in case unseal was called without operator init before
- name: Read the managed bootstrap credential if CLI authentication is needed
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ unseal_namespace }}"
    name: "{{ unseal_secret }}"
    api_version: v1
  register: vault_init_data
  no_log: true
  when: vault_login_needed

- name: Check whether this Vault has managed bootstrap keys
  ansible.builtin.set_fact:
    vaultkeys_exists: "{{ vault_init_data.resources | default([]) | length > 0 }}"

- name: Stop when a sealed Vault has no managed keys
  ansible.builtin.meta: end_play
  when: vault_sealed and not vaultkeys_exists

- name: Decode the managed credential
  ansible.builtin.set_fact:
    vault_init_json: "{{ vault_init_data.resources[0].data.vault_data_json | b64decode | from_json }}"
  no_log: true
  when: vault_login_needed and vaultkeys_exists

- name: Select unseal keys for a sealed Vault
  ansible.builtin.set_fact:
    unseal_keys: "{{ vault_init_json['unseal_keys_hex'] }}"
  no_log: true
  when: vault_sealed and vaultkeys_exists

- name: Unseal leader
  no_log: true
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "{{ vault_pod }}"
    command: vault operator unseal "{{ item }}"
  loop: "{{ unseal_keys | default([]) }}"
  loop_control:
    extended: true
    label: "Unsealing with key {{ ansible_loop.index }}"
  when: vault_sealed

- name: Join Raft cluster
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "{{ item }}"
    command: vault operator raft join http://{{ vault_pod }}.{{ vault_ns }}-internal:8200
  register: join_raft_cluster_out
  until: join_raft_cluster_out is not failed
  retries: 10
  delay: 15
  loop: "{{ followers }}"
  loop_control:
    extended: true
    label: "Joining Raft Cluster on http://{{ vault_pod }}.{{ vault_ns }}-internal:8200"
  when:
    - vault_sealed
    - followers | length > 0

- name: Unseal followers
  no_log: true
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "{{ item.0 }}"
    command: vault operator unseal "{{ item.1 }}"
  loop: "{{ followers | product(unseal_keys | default([])) | list }}"
  loop_control:
    extended: true
    label: "Unsealing {{ item.0 }} with key {{ ansible_loop.index }}"
  when:
    - vault_sealed
    - followers | length > 0

- name: Authenticate the managed Vault CLI
  rhvp.cluster_utils.vault_cli_login:
    namespace: "{{ vault_ns }}"
    pod: "{{ vault_pod }}"
    token: "{{ vault_init_json['root_token'] }}"
  no_log: true
  when: vault_login_needed and vaultkeys_exists
